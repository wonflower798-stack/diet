<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국가고시 CBT 문제은행</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f4f6f9; display: flex; justify-content: center; padding: 20px; }
        .cbt-container { background: #fff; width: 100%; max-width: 600px; border: 2px solid #333; border-radius: 8px; padding: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-bottom: 15px; }
        .score-badge { background: #28a745; color: #fff; padding: 5px 12px; border-radius: 15px; font-weight: bold; }
        .progress-bar { width: 100%; background: #e9ecef; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: #28a745; width: 0%; transition: width 0.3s; }
        .question-text { font-size: 18px; font-weight: bold; margin-bottom: 15px; white-space: pre-line; }
        .options { display: flex; flex-direction: column; gap: 8px; }
        .option-btn { background: #f8f9fa; border: 1px solid #ced4da; padding: 12px; text-align: left; font-size: 15px; border-radius: 6px; cursor: pointer; }
        .option-btn:hover { background: #e9ecef; }
        .feedback { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-weight: bold; }
        .correct { background: #d4edda; color: #155724; }
        .wrong { background: #f8d7da; color: #721c24; }
        .next-btn { margin-top: 15px; width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; display: none; }
    </style>
</head>
<body>

<div class="cbt-container">
    <div class="header">
        <h2 style="margin:0; color:#0056b3;">CBT 문제풀이</h2>
        <div class="score-badge">목표: <span id="correct-count">0</span> / 20</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

    <div id="quiz-box">
        <div class="question-text" id="question-text">문제은행 txt 파일을 로딩 중입니다...</div>
        <div class="options" id="options-container"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn" onclick="loadNextQuestion()">다음 문제</button>
    </div>

    <div id="result-box" style="display:none; text-align:center; padding:30px 0;">
        <h1 style="color:#28a745;">🎉 목표 달성!</h1>
        <p>20문제를 모두 맞히셨습니다. 수고하셨습니다!</p>
        <button class="next-btn" style="display:inline-block; width:auto;" onclick="location.reload()">다시 풀기</button>
    </div>
</div>

<script>
let questionBank = [];
const TARGET_SCORE = 20;
let currentCorrectCount = 0;
let currentQuestion = null;

// 1. txt 파일 불러오기 및 파싱(Parsing)
fetch('questions.txt')
    .then(response => {
        if (!response.ok) throw new Error("txt 파일을 불러올 수 없습니다.");
        return response.text();
    })
    .then(text => {
        parseTXT(text);
        if (questionBank.length === 0) {
            alert("문제를 불러오지 못했습니다. txt 양식을 확인해주세요.");
            return;
        }
        loadNextQuestion();
    })
    .catch(err => {
        document.getElementById('question-text').innerText = "오류: " + err.message;
    });

// 2. txt 문자열을 객체 배열로 변환
function parseTXT(text) {
    const blocks = text.split('---'); // '---' 기준으로 문제 분리
    blocks.forEach(block => {
        const lines = block.trim().split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length < 3) return;

        let q = '', options = [], answer = -1, exp = '';

        lines.forEach(line => {
            if (line.startsWith('[문제]')) {
                q = line.replace('[문제]', '').trim();
            } else if (line.startsWith('[정답]')) {
                answer = parseInt(line.replace('[정답]', '').trim()) - 1; // 0부터 시작하는 인덱스로 변환
            } else if (line.startsWith('[해설]')) {
                exp = line.replace('[해설]', '').trim();
            } else if (/^[1-4]\./.test(line)) {
                options.push(line.replace(/^[1-4]\./, '').trim());
            }
        });

        if (q && options.length > 0 && answer >= 0) {
            questionBank.push({ q, options, answer, exp });
        }
    });
}

// 3. 무작위 문제 출제
function loadNextQuestion() {
    if (currentCorrectCount >= TARGET_SCORE) {
        document.getElementById('quiz-box').style.display = 'none';
        document.getElementById('result-box').style.display = 'block';
        return;
    }

    document.getElementById('feedback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';

    // 무작위 문제 선택
    const randomIndex = Math.floor(Math.random() * questionBank.length);
    currentQuestion = questionBank[randomIndex];

    document.getElementById('question-text').innerText = `Q. ${currentQuestion.q}`;
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    currentQuestion.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${idx + 1}. ${opt}`;
        btn.onclick = () => checkAnswer(idx);
        container.appendChild(btn);
    });
}

// 4. 정답 체크
function checkAnswer(selectedIndex) {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.style.pointerEvents = 'none');

    const feedback = document.getElementById('feedback');
    feedback.style.display = 'block';

    if (selectedIndex === currentQuestion.answer) {
        currentCorrectCount++;
        feedback.className = 'feedback correct';
        feedback.innerText = `⭕ 정답입니다! ${currentQuestion.exp ? '(' + currentQuestion.exp + ')' : ''}`;
        
        document.getElementById('correct-count').innerText = currentCorrectCount;
        document.getElementById('progress-fill').style.width = `${(currentCorrectCount / TARGET_SCORE) * 100}%`;
    } else {
        feedback.className = 'feedback wrong';
        feedback.innerText = `❌ 오답입니다. (정답: ${currentQuestion.answer + 1}번) ${currentQuestion.exp ? '\n해설: ' + currentQuestion.exp : ''}`;
    }

    document.getElementById('next-btn').style.display = 'block';
}
</script>

</body>
</html>
